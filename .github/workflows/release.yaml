name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --tests=false

      - name: Lint OpenTelemetry module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --tests=false
          working-directory: otel

      - name: Lint code mode module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --tests=false
          working-directory: codemode

      - name: Lint terminal UI module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --tests=false
          working-directory: tui

      - name: Lint OPA WebAssembly module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --tests=false
          working-directory: policyopawasm

      - name: Lint in-memory shell sandbox module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --tests=false
          working-directory: sandboxshell

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Vet
        run: go vet ./...

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
